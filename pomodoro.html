<!DOCTYPE html>
<html lang="en">    
   
<head>
<title>Bite-Sized Timer</title>    
    <link rel="stylesheet" href ="timerstyle.css">
    <script src="script.js" defer></script>
<meta charset="UTF-8">
</head>

<body>
  
  <h3 class="cornerquote"> <em>Pomodoro Timer</em> by SmartCookie </h3> <br>
    <h3 class="cornerquote"> ...  </h3>
  
  <div id=notifBox class="notifications"> </div>
            <div id="timerDisplay">0:25:00</div>
       <br>
        <div class="timerButtons">
        <button id="startButton" class="button">Start</button>
        <button id="resetButton" class = "button">Reset</button> <br>
        </div>
  <br>

 
     <button id="openButton" class = "button">&#9776;  Settings </button> 
  <h1>                        </h1>
  
 <div id="mySettings" class="sidebar"> 
        
  <button id="closeButton" class="button">&times; Save & Exit </button>
      
    <h2>Timer Settings ⚙️</h2>
      
      Work time: <input type="number" id="hoursInput" placeholder="Hours" min="0" max="6"> : <input type="number" id="minutesInput" placeholder="Minutes (25 by default)" min="1" max="59">|
      
      Break time: <input type="number" id="breakMinutesInput" placeholder="Minutes (5 by default)" min="1" max="60">:<input type="number" id="breakSecondsInput" placeholder="Seconds (0 by default)" min="00" max="59">|
      Number of sessions: <input type="number" id="sessionInput" placeholder="Sessions (3 by default)" min="1" max="10">
   <h1>                                                          </h1>

     

</div>
