  <div class="timer"> <!--timer-->
    <input id=messageBox class="messages" type="text" placeholder ="what will you focus on today? (type me)"> 
    <div id="timerDisplay">0:25:00</div>
     
        <div class="timerButtons">
        <button id="openButton" class="buttons">Settings </button> 
        <button id="startButton" class = "buttons">Start</button>
        <button id="resetButton" class = "buttons">Reset</button> <br>
        </div>
  </div>

  
 <div id="mySettings" class="sidebar"> 
        
  <button id="closeButton" class = "buttons">&times; Save & Exit </button>
     
    <h2>Timer Settings ⚙️</h2>
  
      
      Work time: <input type="number" id="hoursInput" placeholder="Hours" min="0" max="6"> : <input type="number" id="minutesInput" placeholder="Minutes (25 by default)" min="1" max="59"> <br><br>
      
      Break time: <input type="number" id="breakMinutesInput" placeholder="Minutes (5 by default)" min="1" max="60"> : <input type="number" id="breakSecondsInput" placeholder="Seconds (0 by default)" min="00" max="59"> <br><br>
      Number of sessions: <input type="number" id="sessionInput" placeholder="Sessions (3 by default)" min="1" max="10">
   <h1>  
   </h1>
   <h5><em>please enter "0" into minutes input to clarify 0 minutes for study or break!</em></h5>
